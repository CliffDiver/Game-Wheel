<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game Picker – Shared Wheel (Firebase)</title>
  <style>
    :root{ --bg:#070708; --panel:#0b0c0e; --muted:#9aa0a6; --fg:#e6eef8; }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,system-ui,-apple-system,Arial;color:var(--fg);background:var(--bg)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .card{width:100%;max-width:880px;border-radius:14px;padding:18px;background:linear-gradient(180deg, rgba(255,255,255,0.012), rgba(255,255,255,0.006));box-shadow:0 18px 60px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.03)}
    .col{display:flex;flex-direction:column;align-items:center;gap:12px}
    .wheel-outer{position:relative;width:560px;max-width:92vw}
    canvas#wheel{width:100%;height:auto;border-radius:12px;display:block;position:relative;z-index:2}
    .glow-ambient{position:absolute;inset:0;border-radius:12px;z-index:1;filter:blur(60px) saturate(120%);transition:background 240ms linear;opacity:0.9}
    .pointer-fixed{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:22px solid #b8babd;z-index:5;filter:drop-shadow(0 2px 0 rgba(0,0,0,0.35))}
    .controls{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;justify-content:center}
    select,button{background:var(--panel);border:1px solid rgba(255,255,255,0.06);color:var(--fg);padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
    button:active{transform:translateY(1px)}
    .announcement{margin-top:6px;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.005));width:100%;text-align:center;font-weight:800;letter-spacing:.2px}
    .edit-wrap{width:100%;margin-top:12px}
    .edit-toggle{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .edit-card{margin-top:10px;padding:12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.004));border:1px solid rgba(255,255,255,0.05)}
    textarea#editBox{width:100%;min-height:180px;background:transparent;border:1px dashed rgba(255,255,255,0.08);padding:10px;border-radius:8px;color:var(--fg);font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
    footer{margin-top:10px;text-align:center;color:var(--muted);font-size:13px}
    .status{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card col">
      <div class="wheel-outer">
        <div class="glow-ambient" id="glow"></div>
        <div class="pointer-fixed"></div>
        <canvas id="wheel" width="960" height="960" aria-label="Game picker wheel"></canvas>
      </div>
      <div class="controls">
        <select id="wheelSelect" aria-label="Wheel Category"></select>
        <button id="spinBtn">Spin</button>
        <button id="addRandom">Add Random</button>
        <button id="toggleEdit" class="edit-toggle">Edit Lists</button>
      </div>
      <div class="announcement" id="announcement">Loading shared lists…</div>
      <div class="status" id="status"></div>
      <div class="edit-wrap" id="editWrap" style="display:none">
        <div class="edit-card">
          <p style="margin:0 0 8px 0;color:var(--muted)">
            Use headers like <code>[shooter]</code>. One game per line. Click <strong>Update Lists</strong> to save to Firebase for everyone.
          </p>
          <textarea id="editBox"></textarea>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
            <button id="updateLists">Update Lists</button>
            <button id="resetLists">Reset to Defaults</button>
            <button id="clearSaved">Clear Cloud Lists</button>
          </div>
        </div>
      </div>
      <footer>Share this file’s hosted link in Discord. Everyone with the link can edit. Data is synced via Firebase.</footer>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

</html>
